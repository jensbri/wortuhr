<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wortuhr</title>
    <style>
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        .clock-container {
            background-color: #000;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 380px;
            user-select: none;
        }
        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .word {
            color: #222;
            font-weight: bold;
            font-size: 24px;
            transition: all 0.3s ease;
        }
        .active {
            color: #fff;
            text-shadow: 0 0 12px #fff, 0 0 20px #fff;
        }
        .dots-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            background-color: #222;
            transition: all 0.3s ease;
        }
        .dot-active {
            background-color: #fff;
            box-shadow: 0 0 10px #fff;
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <div class="row"><span class="word">ES</span><span class="word">IST</span><span class="word">ZEHN</span><span class="word">FÜNF</span></div>
        <div class="row"><span class="word">VIERTEL</span><span class="word">MINUTEN</span></div>
        <div class="row"><span class="word">VOR</span><span class="word">NACH</span><span class="word">HALB</span></div>
        <div class="row"><span class="word">EINS</span><span class="word">SIEBEN</span><span class="word">ZWEI</span></div>
        <div class="row"><span class="word">DREI</span><span class="word">VIER</span></div>
        <div class="row"><span class="word">ACHT</span><span class="word">FÜNF</span><span class="word">ZWÖLF</span></div>
        <div class="row"><span class="word">ZEHN</span><span class="word">ELF</span></div>
        <div class="row"><span class="word">NEUN</span><span class="word">SECHS</span><span class="word">UHR</span></div>
        
        <div class="dots-container">
            <div class="dot" id="dot-1"></div>
            <div class="dot" id="dot-2"></div>
            <div class="dot" id="dot-3"></div>
            <div class="dot" id="dot-4"></div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hour = now.getHours() % 12;
            let minute = now.getMinutes();

            let activeWords = ["ES", "IST"];
            let dots = minute % 5;
            let m_base = Math.floor(minute / 5) * 5;

            // Minuten-Logik
            if (m_base === 5) activeWords.push("FÜNF", "NACH");
            else if (m_base === 10) activeWords.push("ZEHN", "NACH", "MINUTEN");
            else if (m_base === 15) activeWords.push("VIERTEL", "NACH");
            else if (m_base === 20) activeWords.push("ZEHN", "VOR", "HALB", "MINUTEN");
            else if (m_base === 25) activeWords.push("FÜNF", "VOR", "HALB", "MINUTEN");
            else if (m_base === 30) activeWords.push("HALB");
            else if (m_base === 35) activeWords.push("FÜNF", "NACH", "HALB", "MINUTEN");
            else if (m_base === 40) activeWords.push("ZEHN", "NACH", "HALB", "MINUTEN");
            else if (m_base === 45) activeWords.push("VIERTEL", "VOR");
            else if (m_base === 50) activeWords.push("ZEHN", "VOR", "MINUTEN");
            else if (m_base === 55) activeWords.push("FÜNF", "VOR");

            // Stunden-Logik (Sprung ab Minute 20)
            let displayHour = (m_base >= 20) ? (hour + 1) % 12 : hour;
            if (displayHour === 0) displayHour = 12;

            const hourMap = {
                1: "EINS", 2: "ZWEI", 3: "DREI", 4: "VIER", 5: "FÜNF",
                6: "SECHS", 7: "SIEBEN", 8: "ACHT", 9: "NEUN", 10: "ZEHN",
                11: "ELF", 12: "ZWÖLF"
            };
            activeWords.push(hourMap[displayHour]);

            if (m_base === 0) activeWords.push("UHR");

            // UI Aktualisieren: Wörter
            document.querySelectorAll('.word').forEach(el => {
                if (activeWords.includes(el.innerText)) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });

            // UI Aktualisieren: Punkte
            const dotElements = document.querySelectorAll('.dot');
            dotElements.forEach((el, index) => {
                if (index < dots) {
                    el.classList.add('dot-active');
                } else {
                    el.classList.remove('dot-active');
                }
            });
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
